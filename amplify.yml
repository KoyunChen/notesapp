version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Switch or install Node 22 via nvm
        - nvm install 22
        - nvm use 22
        - node -v
        - npm ci
    build:
      commands:
        - npm install
        - npm run build
  artifacts:
    baseDirectory: .next # or 'dist', 'build', etc., depending on your framework
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
